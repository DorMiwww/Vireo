name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit & integration tests
        run: ./gradlew test --no-daemon

      - name: Build CLI distribution
        run: ./gradlew :vireo-cli:installDist --no-daemon

      - name: Verify CLI executable
        run: |
          ./vireo-cli/build/install/vireo/bin/vireo --version
          ./vireo-cli/build/install/vireo/bin/vireo --help
          ./vireo-cli/build/install/vireo/bin/vireo render --help
          ./vireo-cli/build/install/vireo/bin/vireo check showcase/card.dac
          ./vireo-cli/build/install/vireo/bin/vireo render showcase/card.dac --html --snippet

      - name: Test installer script
        run: |
          chmod +x ./install.sh
          ./install.sh
          ~/.local/bin/vireo --version

  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Determine Project Version
        id: version
        run: |
          VERSION=$(grep -m 1 'version = "' build.gradle.kts | sed 's/.*version = "\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected project version: $VERSION"
          if [[ "$VERSION" == *"-SNAPSHOT" ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "release_name=Vireo Development Build ($VERSION)" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "tag=v$VERSION" >> $GITHUB_OUTPUT
            echo "release_name=Vireo v$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Build Distribution Archives
        run: |
          ./gradlew :vireo-cli:distTar :vireo-cli:distZip --no-daemon
          cd vireo-cli/build/distributions
          sha256sum * > checksums.sha256
          ls -la

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.release_name }}
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          files: |
            vireo-cli/build/distributions/vireo-*.tar.gz
            vireo-cli/build/distributions/vireo-*.zip
            vireo-cli/build/distributions/checksums.sha256
          body: |
            ## Vireo CLI Release ${{ steps.version.outputs.version }}

            Compiled and verified automatically on GitHub Actions CI.

            ### Quick Install (macOS & Linux)
            ```bash
            curl -fsSL https://raw.githubusercontent.com/DorMiwww/Vireo/main/install.sh | bash
            ```
